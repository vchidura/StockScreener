services:
  # Optional containerized PostgreSQL. The normal local deployment uses
  # DB_HOST=host.docker.internal and does not enable this profile.
  db:
    profiles: ["embedded-db"]
    image: postgres:17-alpine
    container_name: stock-screener-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stocks_db}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      APP_DB_USER: ${DB_USER:?DB_USER is required}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000_canonical_schema.sql:/docker-entrypoint-initdb.d/00_canonical_schema.sql:ro
      - ./backend/scripts/01_configure_app_role.sh:/docker-entrypoint-initdb.d/01_configure_app_role.sh:ro
    networks:
      - application
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '000_canonical_schema') AND to_regclass('public.equity_bar_revisions') IS NOT NULL AND to_regclass('public.equity_current_bar_projection') IS NOT NULL AND to_regclass('public.equity_canonical_bars') IS NOT NULL\" | grep -q t",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      OPTION_DATA_ENGINE: ${OPTION_DATA_ENGINE:-polygon_developer}
      OPTION_UNDERLYING_DATA_PROVIDER: ${OPTION_UNDERLYING_DATA_PROVIDER:-polygon_stocks}
      OPTION_EQUITY_CONTEXT_ENABLED: ${OPTION_EQUITY_CONTEXT_ENABLED:-false}
      OPTION_STOCK_BEHAVIOR_SHADOW_ENABLED: ${OPTION_STOCK_BEHAVIOR_SHADOW_ENABLED:-false}
      OPTION_STOCK_BEHAVIOR_SHADOW_LAUNCH_FILE: ${OPTION_STOCK_BEHAVIOR_SHADOW_LAUNCH_FILE:-}
      OPTION_PACKAGE_ASSESSMENTS_ENABLED: ${OPTION_PACKAGE_ASSESSMENTS_ENABLED:-false}
      OPTION_OUTCOME_UNAVAILABLE_EVIDENCE_ENABLED: ${OPTION_OUTCOME_UNAVAILABLE_EVIDENCE_ENABLED:-false}
      OPTION_EVENT_CALENDAR_PROVIDER: ${OPTION_EVENT_CALENDAR_PROVIDER:-}
      OPTION_EVENT_CALENDAR_MAX_AGE_SECONDS: ${OPTION_EVENT_CALENDAR_MAX_AGE_SECONDS:-43200}
      OPTION_EXECUTION_ENGINE: ${OPTION_EXECUTION_ENGINE:-paper_proxy}
      OPTION_UNIVERSE_MODE: ${OPTION_UNIVERSE_MODE:-fixed}
      OPTION_FIXED_STOCK_UNDERLYERS: ${OPTION_FIXED_STOCK_UNDERLYERS:-AAPL,AMD,AMZN,GOOGL,META,MSFT,NVDA,PLTR,SOFI,TSLA}
      OPTION_FIXED_ETF_UNDERLYERS: ${OPTION_FIXED_ETF_UNDERLYERS:-SPY,QQQ,IWM}
      OPTION_STOCK_UNIVERSE_SIZE: ${OPTION_STOCK_UNIVERSE_SIZE:-10}
      OPTION_ETF_UNIVERSE_SIZE: ${OPTION_ETF_UNIVERSE_SIZE:-3}
      OPTION_POLL_SECONDS: ${OPTION_POLL_SECONDS:-900}
      OPTION_WORKER_POLL_SECONDS: ${OPTION_WORKER_POLL_SECONDS:-15}
      OPTION_SLOT_SECONDS: ${OPTION_SLOT_SECONDS:-900}
      OPTION_PROVIDER_DELAY_SECONDS: ${OPTION_PROVIDER_DELAY_SECONDS:-900}
      OPTION_PUBLICATION_GRACE_SECONDS: ${OPTION_PUBLICATION_GRACE_SECONDS:-30}
      OPTION_STARTING_CASH: ${OPTION_STARTING_CASH:-250000}
      OPTION_RISK_FREE_RATE: ${OPTION_RISK_FREE_RATE:-0.04}
      OPTION_RISK_FREE_RATE_SOURCE: ${OPTION_RISK_FREE_RATE_SOURCE:-manual_config_v1}
      OPTION_DEFAULT_DIVIDEND_YIELD: ${OPTION_DEFAULT_DIVIDEND_YIELD:-0}
      OPTION_DIVIDEND_INPUT_SOURCE: ${OPTION_DIVIDEND_INPUT_SOURCE:?OPTION_DIVIDEND_INPUT_SOURCE is required}
      OPTION_DIVIDEND_INPUT_MAX_AGE_SECONDS: ${OPTION_DIVIDEND_INPUT_MAX_AGE_SECONDS:-43200}
      OPTION_POLICY_FILE: ${OPTION_POLICY_FILE:-options/policies/developer_v1.json}
      OPTION_VALUATION_POLICY_FILE: ${OPTION_VALUATION_POLICY_FILE:-options/policies/valuation_v1.json}
      OPTION_SETTLEMENT_VALUATION_POLICY_FILE: ${OPTION_SETTLEMENT_VALUATION_POLICY_FILE:-options/policies/settlement_valuation_v1.json}
      OPTION_STRATEGY_POLICY_FILE: ${OPTION_STRATEGY_POLICY_FILE:-options/policies/strategy_v1.json}
      OPTION_RAW_ARCHIVE_ROOT: ${OPTION_RAW_ARCHIVE_ROOT:-option-raw}
      OPTION_START_READ_ONLY: ${OPTION_START_READ_ONLY:-true}
      OPTION_RAW_ARCHIVE_ENABLED: ${OPTION_RAW_ARCHIVE_ENABLED:-false}
      OPTION_TECHNICAL_FORWARD_LAUNCH_FILE: ${OPTION_TECHNICAL_FORWARD_LAUNCH_FILE:-}
      OPTION_TECHNICAL_FORWARD_LAUNCH_SHA256: ${OPTION_TECHNICAL_FORWARD_LAUNCH_SHA256:-}
      OPTION_MAXIMUM_EXECUTION_LAG_SECONDS: ${OPTION_MAXIMUM_EXECUTION_LAG_SECONDS:-1800}
      OPTION_TRADE_INGESTION_ENABLED: ${OPTION_TRADE_INGESTION_ENABLED:-false}
      OPTION_TRADE_WATCHLIST_PER_UNDERLYER: ${OPTION_TRADE_WATCHLIST_PER_UNDERLYER:-15}
      OPTION_TRADE_LOOKBACK_SECONDS: ${OPTION_TRADE_LOOKBACK_SECONDS:-3600}
      OPTION_TRADE_INGESTION_BUDGET_SECONDS: ${OPTION_TRADE_INGESTION_BUDGET_SECONDS:-120}
      OPTION_ACQUISITION_MAXIMUM_DTE: ${OPTION_ACQUISITION_MAXIMUM_DTE:-60}
      OPTION_UNDERLYING_CONCURRENCY: ${OPTION_UNDERLYING_CONCURRENCY:-4}
      OPTION_REFERENCE_CACHE_SECONDS: ${OPTION_REFERENCE_CACHE_SECONDS:-900}
      EQUITY_MATERIALIZATION_INTERVALS: ${EQUITY_MATERIALIZATION_INTERVALS:-5m,15m,30m,1h,1d,1wk,1mo}
      EQUITY_WORKER_POLL_SECONDS: ${EQUITY_WORKER_POLL_SECONDS:-15}
      EQUITY_NATIVE_FETCH_WORKERS: ${EQUITY_NATIVE_FETCH_WORKERS:-8}
      EQUITY_PROVIDER_DELAY_MINUTES: ${EQUITY_PROVIDER_DELAY_MINUTES:-15}
      EQUITY_PUBLICATION_GRACE_SECONDS: ${EQUITY_PUBLICATION_GRACE_SECONDS:-600}
      EQUITY_STALE_RUN_MINUTES: ${EQUITY_STALE_RUN_MINUTES:-60}
      EQUITY_PORTAL_SNAPSHOT_POLL_SECONDS: ${EQUITY_PORTAL_SNAPSHOT_POLL_SECONDS:-60}
      EQUITY_STREAM_FLUSH_SECONDS: ${EQUITY_STREAM_FLUSH_SECONDS:-1}
      EQUITY_STREAM_MAX_RECONNECTS: ${EQUITY_STREAM_MAX_RECONNECTS:-20}
      EQUITY_MATERIALIZED_30M_SETUP_ENABLED: ${EQUITY_MATERIALIZED_30M_SETUP_ENABLED:-true}
      EQUITY_MATERIALIZED_1H_SETUP_ENABLED: ${EQUITY_MATERIALIZED_1H_SETUP_ENABLED:-true}
      EQUITY_MATERIALIZED_1D_SETUP_ENABLED: ${EQUITY_MATERIALIZED_1D_SETUP_ENABLED:-true}
      EQUITY_MATERIALIZED_1WK_SETUP_ENABLED: ${EQUITY_MATERIALIZED_1WK_SETUP_ENABLED:-true}
      EQUITY_MATERIALIZED_1MO_SETUP_ENABLED: ${EQUITY_MATERIALIZED_1MO_SETUP_ENABLED:-true}
      EQUITY_MATERIALIZED_PATTERN_WATCH_ENABLED: ${EQUITY_MATERIALIZED_PATTERN_WATCH_ENABLED:-true}
      EQUITY_MATERIALIZED_PORTAL_SNAPSHOTS_ENABLED: ${EQUITY_MATERIALIZED_PORTAL_SNAPSHOTS_ENABLED:-true}
      EQUITY_MATERIALIZED_SCANNER_PAGE_SNAPSHOTS_ENABLED: ${EQUITY_MATERIALIZED_SCANNER_PAGE_SNAPSHOTS_ENABLED:-true}
    volumes:
      - worker_state:/app/backups:ro
    networks:
      - application

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-screener-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - application
      - portal-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The only ingress path to the portal. Configure the public hostname and
  # http://frontend:80 origin in the Cloudflare Zero Trust dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stock-screener-cloudflared
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    networks:
      - portal-edge
      - tunnel-egress

  # Build the initial selected universe from Polygon only when the table is empty.
  equity-universe-bootstrap:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - python
      - scripts/discover_universe_polygon.py
      - --if-empty
      - --target-size
      - ${EQUITY_UNIVERSE_TARGET_SIZE:-350}
      - --lookback-days
      - ${EQUITY_UNIVERSE_LOOKBACK_DAYS:-20}
    restart: "no"
    environment:
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
    networks:
      - application

  # Finalized equity evidence worker. Enable explicitly with: docker compose --profile equity up -d
  equity-worker:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-equity-worker
    command: python scripts/run_equity_worker.py --behavior-shadow
    restart: unless-stopped
    init: true
    depends_on:
      equity-universe-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
      OPTION_FIXED_STOCK_UNDERLYERS: ${OPTION_FIXED_STOCK_UNDERLYERS:-AAPL,AMD,AMZN,GOOGL,META,MSFT,NVDA,PLTR,SOFI,TSLA}
      OPTION_FIXED_ETF_UNDERLYERS: ${OPTION_FIXED_ETF_UNDERLYERS:-SPY,QQQ,IWM}
      OPTION_STOCK_UNIVERSE_SIZE: ${OPTION_STOCK_UNIVERSE_SIZE:-10}
      OPTION_ETF_UNIVERSE_SIZE: ${OPTION_ETF_UNIVERSE_SIZE:-3}
      EQUITY_MATERIALIZATION_INTERVALS: ${EQUITY_MATERIALIZATION_INTERVALS:-5m,15m,30m,1h,1d,1wk,1mo}
      EQUITY_WORKER_POLL_SECONDS: ${EQUITY_WORKER_POLL_SECONDS:-15}
      EQUITY_NATIVE_FETCH_WORKERS: ${EQUITY_NATIVE_FETCH_WORKERS:-8}
      EQUITY_PROVIDER_DELAY_MINUTES: ${EQUITY_PROVIDER_DELAY_MINUTES:-15}
      EQUITY_STALE_RUN_MINUTES: ${EQUITY_STALE_RUN_MINUTES:-60}
      EQUITY_WORKER_LOCK_NAME: ${EQUITY_WORKER_LOCK_NAME:-stock-screener:equity-materialization-worker}
    volumes:
      - worker_state:/app/backups
    networks:
      - application

  equity-portal-worker:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-equity-portal-worker
    command: python scripts/refresh_equity_portal_snapshots.py --continuous
    restart: unless-stopped
    init: true
    depends_on:
      equity-universe-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      EQUITY_PORTAL_SNAPSHOT_POLL_SECONDS: ${EQUITY_PORTAL_SNAPSHOT_POLL_SECONDS:-60}
    networks:
      - application

  screening-worker:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-screening-worker
    command: python -u scripts/run_screening_worker.py
    restart: unless-stopped
    init: true
    depends_on:
      equity-universe-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      SCREENING_WORKER_POLL_SECONDS: ${SCREENING_WORKER_POLL_SECONDS:-60}
    networks:
      - application

  corporate-action-worker:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-corporate-action-worker
    command: python scripts/run_corporate_action_worker.py
    restart: unless-stopped
    init: true
    depends_on:
      equity-universe-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
      EQUITY_CORPORATE_ACTION_POLL_SECONDS: ${EQUITY_CORPORATE_ACTION_POLL_SECONDS:-21600}
      EQUITY_CORPORATE_ACTION_LOOKBACK_DAYS: ${EQUITY_CORPORATE_ACTION_LOOKBACK_DAYS:-30}
      EQUITY_CORPORATE_ACTION_HORIZON_DAYS: ${EQUITY_CORPORATE_ACTION_HORIZON_DAYS:-365}
      EQUITY_CORPORATE_ACTION_RETRY_SECONDS: ${EQUITY_CORPORATE_ACTION_RETRY_SECONDS:-300}
      EQUITY_CORPORATE_ACTION_WORKER_LOCK_NAME: ${EQUITY_CORPORATE_ACTION_WORKER_LOCK_NAME:-stock-screener:equity-corporate-action-worker}
    networks:
      - application

  stock-alert-preflight:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -u scripts/run_stock_alert_service.py --check
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
    volumes:
      - worker_state:/app/backups:ro
    networks:
      - application

  stock-alert-intraday:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-stock-alert-intraday
    command:
      - python
      - -X
      - utf8
      - -u
      - scripts/run_stock_idea_worker.py
      - --quality-version
      - "2"
      - --state-dir
      - /app/backups/equity-shadow/stock-ideas-forward-v2
    restart: unless-stopped
    init: true
    depends_on:
      stock-alert-preflight:
        condition: service_completed_successfully
      equity-worker:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
    volumes:
      - worker_state:/app/backups
    networks:
      - application

  stock-alert-swing:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-stock-alert-swing
    command:
      - python
      - -X
      - utf8
      - -u
      - scripts/run_stock_idea_worker.py
      - --quality-version
      - "2"
      - --swing
      - --activate-swing-shadow
      - --state-dir
      - /app/backups/equity-shadow/stock-ideas-swing-v1
    restart: unless-stopped
    init: true
    depends_on:
      stock-alert-preflight:
        condition: service_completed_successfully
      equity-worker:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
    volumes:
      - worker_state:/app/backups
    networks:
      - application

  stock-alert-results:
    profiles: ["equity"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-stock-alert-results
    command: python -u scripts/project_stock_alert_results.py --continuous
    restart: unless-stopped
    init: true
    depends_on:
      stock-alert-preflight:
        condition: service_completed_successfully
      stock-alert-intraday:
        condition: service_started
      stock-alert-swing:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
    volumes:
      - worker_state:/app/backups
    networks:
      - application

  # Shared earnings/FOMC calendar facts for the complete equity universe.
  market-event-worker:
    profiles: ["calendar", "options"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-market-event-worker
    command: python scripts/run_market_event_worker.py
    restart: unless-stopped
    init: true
    depends_on:
      equity-universe-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:?FINNHUB_API_KEY is required}
      MARKET_EVENT_POLL_SECONDS: ${MARKET_EVENT_POLL_SECONDS:-21600}
      MARKET_EVENT_LOOKBACK_DAYS: ${MARKET_EVENT_LOOKBACK_DAYS:-1}
      MARKET_EVENT_HORIZON_DAYS: ${MARKET_EVENT_HORIZON_DAYS:-45}
      MARKET_EVENT_WORKER_LOCK_NAME: ${MARKET_EVENT_WORKER_LOCK_NAME:-stock-screener:market-event-worker}
    networks:
      - application

  option-model-input-worker:
    profiles: ["options"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-screener-option-model-input-worker
    command: python scripts/run_option_model_input_worker.py
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      OPTION_MODEL_INPUT_POLL_SECONDS: ${OPTION_MODEL_INPUT_POLL_SECONDS:-21600}
      OPTION_MODEL_INPUT_RETRY_SECONDS: ${OPTION_MODEL_INPUT_RETRY_SECONDS:-300}
      OPTION_MODEL_INPUT_WORKER_LOCK_NAME: ${OPTION_MODEL_INPUT_WORKER_LOCK_NAME:-stock-screener:option-model-input-worker}
    networks:
      - application

  option-launch-preflight:
    profiles: ["options"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -u scripts/run_option_worker.py --check-technical-launch
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_NAME: ${DB_NAME:-stocks_db}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: 5432
      POLYGON_API_KEY: ${POLYGON_API_KEY:?POLYGON_API_KEY is required}
      OPTION_DATA_ENGINE: ${OPTION_DATA_ENGINE:-polygon_developer}
      OPTION_UNDERLYING_DATA_PROVIDER: ${OPTION_UNDERLYING_DATA_PROVIDER:-polygon_stocks}
      OPTION_EVENT_CALENDAR_PROVIDER: ${OPTION_EVENT_CALENDAR_PROVIDER:?OPTION_EVENT_CALENDAR_PROVIDER is required}
      OPTION_EVENT_CALENDAR_MAX_AGE_SECONDS: ${OPTION_EVENT_CALENDAR_MAX_AGE_SECONDS:-43200}
      OPTION_EQUITY_CONTEXT_ENABLED: ${OPTION_EQUITY_CONTEXT_ENABLED:-false}
      OPTION_STOCK_BEHAVIOR_SHADOW_ENABLED: ${OPTION_STOCK_BEHAVIOR_SHADOW_ENABLED:-false}
      OPTION_STOCK_BEHAVIOR_SHADOW_LAUNCH_FILE: ${OPTION_STOCK_BEHAVIOR_SHADOW_LAUNCH_FILE:?OPTION_STOCK_BEHAVIOR_SHADOW_LAUNCH_FILE is required}
      OPTION_PACKAGE_ASSESSMENTS_ENABLED: ${OPTION_PACKAGE_ASSESSMENTS_ENABLED:-false}
      OPTION_OUTCOME_UNAVAILABLE_EVIDENCE_ENABLED: ${OPTION_OUTCOME_UNAVAILABLE_EVIDENCE_ENABLED:-false}
      OPTION_EXECUTION_ENGINE: ${OPTION_EXECUTION_ENGINE:-paper_proxy}
      OPTION_UNIVERSE_MODE: ${OPTION_UNIVERSE_MODE:-fixed}
      OPTION_FIXED_STOCK_UNDERLYERS: ${OPTION_FIXED_STOCK_UNDERLYERS:-AAPL,AMD,AMZN,GOOGL,META,MSFT,NVDA,PLTR,SOFI,TSLA}
      OPTION_FIXED_ETF_UNDERLYERS: ${OPTION_FIXED_ETF_UNDERLYERS:-SPY,QQQ,IWM}
