  realtime-v2-advanced-api:
    <<: *backend-service
    labels: *downstream-labels
    profiles: ["realtime-v2-advanced"]
    container_name: stock-screener-realtime-v2-advanced-api
    stop_grace_period: 30s
    command:
      - python
      - -B
      - scripts/run_realtime_v2_container.py
      - --component
      - api
      - --api-dsn-file
      - /run/secrets/realtime_v2_api_dsn
      - --
      - python
      - -B
      - -m
      - uvicorn
      - scripts.run_realtime_v2_portal_api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    secrets:
      - realtime_v2_api_dsn
    environment:
      REALTIME_V2_ADVANCED_OPTIONS_READS: ${REALTIME_V2_ADVANCED_OPTIONS_READS:-DISABLED}
    ports:
      - "127.0.0.1:${REALTIME_V2_ADVANCED_API_PORT:-8002}:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - scripts/check_http_health.py
        - http://127.0.0.1:8002/api/realtime/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  realtime-v2-advanced-frontend:
    image: alpha-research-realtime-v2-frontend:latest
    profiles: ["realtime-v2-advanced"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_REALTIME_ONLY: "true"
        VITE_REALTIME_COHORT_ID: ${REALTIME_V2_ADVANCED_COHORT_ID:-00000000-0000-0000-0000-000000000000}
        VITE_REALTIME_OPTIONS_V2: ${VITE_REALTIME_OPTIONS_V2:-false}
    container_name: stock-screener-realtime-v2-advanced-frontend
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      realtime-v2-advanced-api:
        condition: service_healthy
    volumes:
      - ./frontend/nginx.realtime-v2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${REALTIME_V2_ADVANCED_FRONTEND_PORT:-5174}:80"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  realtime_v2_advanced_journals:
    name: ${REALTIME_V2_ADVANCED_JOURNALS_VOLUME_NAME:-alpha-research-realtime-v2-advanced-journals}
  realtime_v2_advanced_reports:
    name: ${REALTIME_V2_ADVANCED_REPORTS_VOLUME_NAME:-alpha-research-realtime-v2-advanced-reports}
  realtime_v2_retention:
    name: ${REALTIME_V2_RETENTION_VOLUME_NAME:-alpha-research-realtime-v2-retention-volume-name-required}
    external: true

secrets:
  realtime_v2_app_dsn:
    file: ${REALTIME_V2_DOCKER_SECRET_DIR:-./backend/.realtime-canary/v2-docker-secrets}/realtime_v2_app_dsn
  realtime_v2_admin_dsn:
    file: ${REALTIME_V2_DOCKER_SECRET_DIR:-./backend/.realtime-canary/v2-docker-secrets}/realtime_v2_admin_dsn
  realtime_v2_api_dsn:
    file: ${REALTIME_V2_DOCKER_SECRET_DIR:-./backend/.realtime-canary/v2-docker-secrets}/realtime_v2_api_dsn
  realtime_v2_provider_key:
    file: ${REALTIME_V2_DOCKER_SECRET_DIR:-./backend/.realtime-canary/v2-docker-secrets}/realtime_v2_provider_key

networks:
  application:
    name: ${REALTIME_V2_APPLICATION_NETWORK_NAME:-alpha-research-realtime-v2-application}
