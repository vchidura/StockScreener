name: alpha-research-realtime-v2

x-backend-service: &backend-service
  image: ${REALTIME_V2_BACKEND_IMAGE:?set REALTIME_V2_BACKEND_IMAGE to an approved immutable image}
  build:
    context: ./backend
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  networks:
    - application

x-advanced-environment: &advanced-environment
  REALTIME_V2_EQUITY_PIPELINE: MASSIVE_ADVANCED
  REALTIME_V2_OPTIONS_PIPELINE: DISABLED
  REALTIME_V2_ADVANCED_INGRESS_POLICY_PATH: /app/realtime/policies/advanced_equity_ingress_v1.json
  REALTIME_V2_ADVANCED_INGRESS_POLICY_VERSION: advanced-equity-ingress-v1

x-downstream-labels: &downstream-labels
  stockscreener.realtime.transition-plane: downstream

services:
  realtime-v2-advanced-controller:
    <<: *backend-service
    profiles: ["realtime-v2-advanced-provider"]
    container_name: stock-screener-realtime-v2-advanced-controller
    restart: "on-failure:3"
    command:
      - python
      - -B
      - scripts/run_realtime_v2_container.py
      - --component
      - controller
      - --app-dsn-file
      - /run/secrets/realtime_v2_app_dsn
      - --provider-key-file
      - /run/secrets/realtime_v2_provider_key
      - --
      - python
      - -B
      - scripts/run_realtime_v2_advanced_controller.py
      - --database
      - stocks_realtime_v2
      - --confirm-database-name
      - stocks_realtime_v2
      - --runtime-mode
      - continuous
      - --stream-sessions
      - ${REALTIME_V2_ADVANCED_STREAM_SESSIONS:-4}
      - --connection-attempts
      - ${REALTIME_V2_ADVANCED_CONNECTION_ATTEMPTS:-12}
      - --decoded-bytes
      - ${REALTIME_V2_ADVANCED_DECODED_BYTES:-1073741824}
      - --catch-up-mode
      - ${REALTIME_V2_ADVANCED_CATCH_UP_MODE:-AUTO}
      - --external-ingress
      - --execute
    environment:
      <<: *advanced-environment
      REALTIME_V2_ADVANCED_REST_REPAIR_RESPONSE_BYTE_LIMIT: ${REALTIME_V2_ADVANCED_REST_REPAIR_RESPONSE_BYTE_LIMIT:-}
      REALTIME_V2_ADVANCED_REST_REPAIR_EXPECTED_COST: ${REALTIME_V2_ADVANCED_REST_REPAIR_EXPECTED_COST:-}
      REALTIME_V2_ADVANCED_JOURNAL_DIR: /var/lib/realtime-v2-advanced
    secrets:
      - realtime_v2_app_dsn
      - realtime_v2_provider_key
    volumes:
      - realtime_v2_advanced_journals:/var/lib/realtime-v2-advanced
      - realtime_v2_advanced_reports:/var/lib/realtime-v2-reports
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - scripts/run_realtime_v2_container.py
        - --component
        - controller
        - --app-dsn-file
        - /run/secrets/realtime_v2_app_dsn
        - --provider-key-file
        - /run/secrets/realtime_v2_provider_key
        - --
        - python
        - -B
        - scripts/report_realtime_v2_advanced_health.py
        - --component
        - controller
        - --runtime-mode
        - continuous
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s

  realtime-v2-advanced-capability-refresh:
    <<: *backend-service
